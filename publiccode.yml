description:
  fr:
    shortDescription: Habillage DSFR (thèmes clair et sombre) et en-tête institutionnel pour Nextcloud, développé pour Nuage (ministère de l'Éducation nationale).
    longDescription: >
      Application Nextcloud minimale qui applique le Système de Design de l'État (DSFR) à une instance Nextcloud :
      couche de tokens clair/sombre, typographie Marianne, mire de connexion, pages publiques, et en-tête
      institutionnel à deux rangées (bloc-marque, intitulé de service, navigation textuelle des applications).
      Aucun build, aucune dépendance, aucun état : désactivation instantanée par occ app:disable.
    features:
      - Thèmes DSFR clair et sombre, contrastes élevés
      - En-tête deux rangées avec bloc-marque et navigation textuelle
      - Mire de connexion et pages publiques habillées
      - Verrous d'exploitation (masquages d'interface) dans une feuille séparée
